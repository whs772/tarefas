<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarefas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6f55">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f3f5f2;
    --surface: #ffffff;
    --text: #1d2a24;
    --muted: #6b7a72;
    --line: #d9dfda;
    --accent: #2f6f55;
    --accent-text: #ffffff;
    --danger: #b3402f;
    --tree: #8fa89b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141916;
      --bg: #141916;
      --surface: #1c2420;
      --text: #e6ede8;
      --muted: #8d9c93;
      --line: #2e3a34;
      --accent: #5bb38d;
      --accent-text: #0f1a14;
      --danger: #e0816f;
      --tree: #4f6a5c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 680px; margin: 0 auto; padding: 10px 6px 80px; }
  h1, .resumo { padding: 0 6px; }
  h1 { font-size: 2rem; margin: 0 0 4px; font-weight: 700; }
  .resumo { color: var(--muted); margin: 0 0 24px; font-family: system-ui, sans-serif; font-size: .9rem; }

  form.nova { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    padding: 10px 12px;
    font: inherit; font-size: 1rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  input[type="text"]:focus-visible, button:focus-visible, input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button {
    font: inherit; font-family: system-ui, sans-serif; font-size: .9rem;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
  }
  button.primario { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }

  ul { list-style: none; margin: 0; padding: 0; }
  /* Linhas de árvore (├── └──) ligando tarefas às subtarefas */
  ul ul { margin-left: 20px; }
  ul ul > li { position: relative; padding-left: 12px; }
  ul ul > li::before {            /* traço vertical */
    content: ""; position: absolute; left: 0; top: -4px; bottom: -4px;
    border-left: 2px solid var(--tree);
  }
  ul ul > li:last-child::before { bottom: auto; height: 24px; }   /* └ no último */
  ul ul > li::after {             /* traço horizontal */
    content: ""; position: absolute; left: 0; top: 18px; width: 12px;
    border-top: 2px solid var(--tree);
  }
  li { margin: 4px 0; }
  /* Hierarquia: cada nível fica mais escuro que o anterior */
  .nivel-0 { --tint: 0%; }
  .nivel-1 { --tint: 22%; }
  .nivel-2 { --tint: 44%; }
  .nivel-3 { --tint: 58%; }
  .nivel-4 { --tint: 68%; }
  @media (prefers-color-scheme: dark) {
    .nivel-0 { --tint: 58%; }
    .nivel-1 { --tint: 36%; }
    .nivel-2 { --tint: 15%; }
    .nivel-3 { --tint: 5%; }
    .nivel-4 { --tint: 0%; }
  }
  .linha {
    display: flex; align-items: center; gap: 8px;
    background: color-mix(in srgb, var(--accent) var(--tint), var(--surface));
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 8px;
  }
  .linha input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .texto { flex: 1; word-break: break-word; }
  .feita > .linha .texto { text-decoration: line-through; color: var(--muted); }
  .acoes { display: flex; gap: 4px; flex: none; }
  .acoes button { padding: 2px 8px; font-size: .85rem; }
  .acoes .del { color: var(--danger); }
  .acoes button[data-acao="sub"], form.sub button { font-size: 1.5rem; line-height: 1; min-width: 40px; height: 30px; padding: 0 10px; }
  .toggle { border: none; background: none; padding: 0; color: var(--muted); width: 30px; height: 28px; font-size: 1.5rem; line-height: 1; flex: none; }
  .toggle:hover { color: var(--text); }
  input[type="checkbox"]:disabled { opacity: .45; cursor: not-allowed; }
  .toggle.vazio { visibility: hidden; }
  form.sub { display: flex; gap: 6px; margin: 6px 0 0 14px; }
  .vazia { color: var(--muted); text-align: center; padding: 32px 0; font-family: system-ui, sans-serif; }
  .rodape { margin-top: 24px; text-align: right; }
  .rodape button { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>Tarefas</h1>
  <p class="resumo" id="resumo"></p>

  <form class="nova" id="formNova">
    <input type="text" id="inputNova" placeholder="Nova tarefa" aria-label="Nova tarefa" autocomplete="off">
    <button class="primario" type="submit">Adicionar</button>
  </form>

  <div id="lista"></div>

  <div class="rodape"><button id="limparFeitas" type="button">Remover tarefas concluídas</button></div>
</main>

<script>
  const CHAVE = "tarefas-v1";
  let tarefas = [];
  let subAberto = null; // id da tarefa com campo de subtarefa aberto

  function carregar() {
    try { tarefas = JSON.parse(localStorage.getItem(CHAVE)) || []; } catch (e) { tarefas = []; }
  }
  function salvar() {
    normalizar(tarefas);
    try { localStorage.setItem(CHAVE, JSON.stringify(tarefas)); } catch (e) {}
  }
  const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const criar = texto => ({ id: novoId(), texto, feita: false, aberta: true, filhas: [] });

  // Busca uma tarefa e a lista que a contém, em qualquer nível
  function achar(id, lista = tarefas) {
    for (let i = 0; i < lista.length; i++) {
      if (lista[i].id === id) return { item: lista[i], lista, i };
      const r = achar(id, lista[i].filhas);
      if (r) return r;
    }
    return null;
  }
  // Uma tarefa só pode estar concluída se todas as subtarefas estiverem concluídas
  function normalizar(lista) {
    for (const t of lista) {
      normalizar(t.filhas);
      if (t.filhas.some(f => !f.feita)) t.feita = false;
    }
  }
  function contar(lista) {
    let total = 0, feitas = 0;
    for (const t of lista) {
      total++; if (t.feita) feitas++;
      const c = contar(t.filhas); total += c.total; feitas += c.feitas;
    }
    return { total, feitas };
  }
  function removerFeitas(lista) {
    return lista.filter(t => !t.feita).map(t => ({ ...t, filhas: removerFeitas(t.filhas) }));
  }

  function el(tag, props = {}, ...filhos) {
    const e = document.createElement(tag);
    Object.assign(e, props);
    filhos.forEach(f => e.append(f));
    return e;
  }

  function desenharLista(lista, nivel = 0) {
    const ul = el("ul");
    for (const t of lista) {
      const li = el("li", { className: t.feita ? "feita" : "" });
      li.dataset.id = t.id;

      const toggle = el("button", {
        className: "toggle" + (t.filhas.length ? "" : " vazio"),
        type: "button",
        textContent: t.aberta ? "▾" : "▸",
        title: t.aberta ? "Recolher" : "Expandir"
      });
      toggle.dataset.acao = "toggle";

      const pendentes = t.filhas.some(f => !f.feita);
      const check = el("input", {
        type: "checkbox", checked: t.feita, ariaLabel: "Concluir",
        disabled: pendentes,
        title: pendentes ? "Conclua as subtarefas primeiro" : ""
      });
      check.dataset.acao = "check";

      const texto = el("span", { className: "texto", textContent: t.texto });

      const add = el("button", { type: "button", textContent: "+", title: "Adicionar subtarefa", ariaLabel: "Adicionar subtarefa" });
      add.dataset.acao = "sub";
      const del = el("button", { type: "button", className: "del", textContent: "✕", title: "Excluir", ariaLabel: "Excluir" });
      del.dataset.acao = "del";

      li.append(el("div", { className: "linha nivel-" + Math.min(nivel, 4) }, toggle, check, texto, el("div", { className: "acoes" }, add, del)));

      if (subAberto === t.id) {
        const f = el("form", { className: "sub" });
        f.dataset.acao = "enviarSub";
        const inp = el("input", { type: "text", placeholder: "Nova subtarefa", autocomplete: "off" });
        f.append(inp, el("button", { type: "submit", className: "primario", textContent: "+", title: "Adicionar subtarefa", ariaLabel: "Adicionar subtarefa" }));
        li.append(f);
        setTimeout(() => inp.focus(), 0);
      }

      if (t.filhas.length && t.aberta) li.append(desenharLista(t.filhas, nivel + 1));
      ul.append(li);
    }
    return ul;
  }

  function desenhar() {
    const raiz = document.getElementById("lista");
    raiz.replaceChildren();
    if (!tarefas.length) {
      raiz.append(el("div", { className: "vazia", textContent: "Nenhuma tarefa ainda. Adicione a primeira acima." }));
    } else {
      raiz.append(desenharLista(tarefas));
    }
    const { total, feitas } = contar(tarefas);
    document.getElementById("resumo").textContent = total ? `${feitas} de ${total} concluídas` : "";
  }

  // Eventos
  document.getElementById("formNova").addEventListener("submit", e => {
    e.preventDefault();
    const inp = document.getElementById("inputNova");
    const texto = inp.value.trim();
    if (!texto) return;
    tarefas.push(criar(texto));
    inp.value = "";
    salvar(); desenhar();
  });

  const listaEl = document.getElementById("lista");

  listaEl.addEventListener("submit", e => {
    const form = e.target.closest("form.sub");
    if (!form) return;
    e.preventDefault();
    const id = form.closest("li").dataset.id;
    const texto = form.querySelector("input").value.trim();
    if (!texto) return;
    const r = achar(id);
    r.item.filhas.push(criar(texto));
    r.item.aberta = true;
    subAberto = null;
    salvar(); desenhar();
  });

  listaEl.addEventListener("click", e => {
    const btn = e.target.closest("[data-acao]");
    if (!btn || btn.tagName === "FORM" || btn.type === "checkbox") return;
    const id = btn.closest("li").dataset.id;
    const r = achar(id);
    if (btn.dataset.acao === "toggle") r.item.aberta = !r.item.aberta;
    if (btn.dataset.acao === "sub") subAberto = subAberto === id ? null : id;
    if (btn.dataset.acao === "del") {
      const n = contar(r.item.filhas).total;
      if (n && !confirm(`Excluir esta tarefa e suas ${n} subtarefa(s)?`)) return;
      r.lista.splice(r.i, 1);
    }
    salvar(); desenhar();
  });

  // Clique em qualquer lugar fora do campo (ou do botão +) fecha o campo de subtarefa
  document.addEventListener("click", e => {
    if (!subAberto || e.target.type === "checkbox") return;
    if (e.target.closest("form.sub") || e.target.closest('[data-acao="sub"]')) return;
    subAberto = null;
    desenhar();
  });

  listaEl.addEventListener("change", e => {
    if (e.target.dataset.acao !== "check") return;
    subAberto = null;
    const r = achar(e.target.closest("li").dataset.id);
    r.item.feita = e.target.checked;
    salvar(); desenhar();
  });

  listaEl.addEventListener("keydown", e => {
    if (e.key === "Escape" && subAberto) { subAberto = null; desenhar(); }
  });

  document.getElementById("limparFeitas").addEventListener("click", () => {
    const { feitas } = contar(tarefas);
    if (!feitas || !confirm(`Remover ${feitas} tarefa(s) concluída(s)?`)) return;
    tarefas = removerFeitas(tarefas);
    salvar(); desenhar();
  });

  carregar();
  desenhar();

  // PWA: registra o service worker (só funciona via https ou localhost)
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
